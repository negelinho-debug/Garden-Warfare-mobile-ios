
name: Build Garden Warfare IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout game
        uses: actions/checkout@v4

      - name: Check game files
        run: |
          test -f project.godot
          test -f scenes/main.tscn
          test -f assets/models/peashooter.glb

      - name: Create iOS export settings
        run: |
          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="iOS"
          platform="iOS"
          runnable=true
          advanced_options=true
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          architectures/arm64=true
          application/app_store_team_id="ABCDE12345"
          application/bundle_identifier="com.negelinho.gardenmobile"
          application/export_project_only=true
          application/delete_old_export_files_unconditionally=true
          application/code_sign_identity_debug=""
          application/code_sign_identity_release=""
          application/short_version="0.3"
          application/version="1"
          orientation/portrait=false
          orientation/landscape_left=true
          orientation/landscape_right=true
          EOF

      - name: Build unsigned IPA
        uses: gamekiller2048/Godot-Unsigned-IOS@v2
        with:
          godot-version: "4.4.1"
          godot-flavor: "stable"
          export-name: "GardenMobile"
          configuration: "release"
