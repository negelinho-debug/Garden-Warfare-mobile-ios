
name: Update Garden Game v0.4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install v0.4 project
        run: |
          set -e
          test -f Garden_Project_v0.4.zip
          unzip -tq Garden_Project_v0.4.zip
          unzip -oq Garden_Project_v0.4.zip -d . -x '.github/*'
          test -f project.godot
          test -f assets/models/peashooter.glb
          grep -q 'func _handle_touch' scripts/main.gd
          grep -q 'func _hit_flash' scripts/garden.gd
          rm Garden_Project_v0.4.zip

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Validate before saving
        run: |
          godot --headless --path . --editor --import --quit
          godot --headless --path . --quit-after 5

      - name: Save updated game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- scripts scenes assets project.godot README.md README_RU.md Garden_Project_v0.4.zip
          if git diff --cached --quiet; then
            echo "Project already updated"
          else
            git commit -m "Update Garden Warfare to v0.4"
            git push
          fi
