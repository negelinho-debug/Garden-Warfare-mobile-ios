
name: Upgrade Garden Warfare v0.5 - Animation Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  animate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout existing v0.5
        uses: actions/checkout@v4

      - name: Add Peashooter animations
        shell: bash
        run: |
          set -euo pipefail

          test -f scripts/garden.gd
          test -f assets/models/peashooter.glb
          test -f assets/textures/lawn.png
          test -f assets/audio/pea_shot.wav

          cat > scripts/pea_anim.gd <<'GDSCRIPT'
          extends Node3D

          var actor: CharacterBody3D
          var head: Node3D
          var leaves: Array[Node3D] = []
          var clock := 0.0
          var movement := 0.0
          var recoil_amount := 0.0
          var landing_amount := 0.0
          var previously_airborne := false

          func configure(model: Node3D, character: CharacterBody3D) -> void:
            actor = character
            head = Node3D.new()
            head.name = "PeashooterHeadPivot"
            model.add_child(head)
            head.position = Vector3(0.0, 1.48, 0.0)

            var parts: Array[MeshInstance3D] = []
            _collect_meshes(model, parts)

            for part in parts:
              var n := String(part.name).to_lower()
              var belongs_to_head := n.begins_with("green_") or n.begins_with("green_light_") or n.begins_with("snout_") or n.begins_with("lip_") or n.begins_with("mouth_") or n.begins_with("dark_green_") or n.begins_with("eyes_") or n.begins_with("pupil_") or n.begins_with("shine_") or n.begins_with("freckles_")

              if belongs_to_head:
                part.reparent(head, true)
              elif (n.begins_with("leaf_") or n.begins_with("light_leaf_")) and leaves.size() < 24:
                var pivot := Node3D.new()
                pivot.name = "LeafPivot"
                model.add_child(pivot)
                pivot.global_position = part.to_global(part.get_aabb().get_center())
                part.reparent(pivot, true)
                leaves.append(pivot)

            print("Peashooter animation ready")

          func _collect_meshes(root: Node, result: Array[MeshInstance3D]) -> void:
            for child in root.get_children():
              if child is MeshInstance3D:
                result.append(child)
              _collect_meshes(child, result)

          func recoil() -> void:
            recoil_amount = 1.0

          func _process(delta: float) -> void:
            if actor == null or head == null:
              return

            clock += delta

            var horizontal_speed := Vector2(actor.velocity.x, actor.velocity.z).length()
            movement = move_toward(movement, clampf(horizontal_speed / 5.5, 0.0, 1.0), delta * 6.0)
            recoil_amount = move_toward(recoil_amount, 0.0, delta * 6.5)

            var airborne := not actor.is_on_floor()

            if previously_airborne and not airborne:
              landing_amount = 1.0

            previously_airborne = airborne
            landing_amount = move_toward(landing_amount, 0.0, delta * 4.0)

            var step_phase := clock * 10.0

            head.rotation.x = sin(clock * 2.6) * 0.025 + sin(step_phase) * movement * 0.10 - recoil_amount * 0.23
            head.rotation.z = sin(clock * 1.8) * 0.035 + cos(step_phase * 0.5) * movement * 0.055

            head.position.y = 1.48 + sin(clock * 2.7) * 0.016 + absf(sin(step_phase)) * movement * 0.055 + (0.10 if airborne else 0.0) - landing_amount * 0.11

            head.scale = Vector3(1.0 + landing_amount * 0.05, 1.0 - landing_amount * 0.08, 1.0 + landing_amount * 0.05)

            for i in range(leaves.size()):
              var phase := float(i) * 0.65
              leaves[i].rotation.z = sin(clock * 2.8 + phase) * 0.05 + sin(step_phase + phase) * movement * 0.18
              leaves[i].rotation.x = cos(clock * 2.0 + phase) * 0.035 + cos(step_phase + phase) * movement * 0.08
          GDSCRIPT

          cat > /tmp/patch_animations.py <<'PYTHON'
          from pathlib import Path

          p = Path('scripts/garden.gd')
          s = p.read_text()

          if 'const PEA_ANIM =' not in s:
              anchor = 'const MODEL_LOADER = preload("res://scripts/model_loader.gd")'
              assert anchor in s, 'Model loader not found'
              s = s.replace(
                  anchor,
                  anchor + '\nconst PEA_ANIM = preload("res://scripts/pea_anim.gd")',
                  1
              )

          if 'var pea_anim' not in s:
              anchor = 'var camera: Camera3D'
              assert anchor in s, 'Camera property not found'
              s = s.replace(anchor, anchor + '\nvar pea_anim', 1)

          if 'pea_anim.configure(imported, player)' not in s:
              anchor = '\t\tplant.add_child(imported)'
              assert anchor in s, 'Peashooter model loading point not found'
              s = s.replace(
                  anchor,
                  anchor +
                  '\n\t\tpea_anim = PEA_ANIM.new()'
                  '\n\t\tplayer.add_child(pea_anim)'
                  '\n\t\tpea_anim.configure(imported, player)',
                  1
              )

          if 'pea_anim.recoil()' not in s:
              anchor = '\tshot_cooldown = 0.25'
              assert anchor in s, 'Shooting function not found'
              s = s.replace(
                  anchor,
                  anchor +
                  '\n\tif pea_anim != null:'
                  '\n\t\tpea_anim.recoil()',
                  1
              )

          p.write_text(s)

          p = Path('scripts/main.gd')
          s = p.read_text()
          s = s.replace(
              '3D GARDEN PROTOTYPE  •  VERSION 0.5',
              'ANIMATED PEASHOOTER  •  VERSION 0.5.1'
          )
          p.write_text(s)

          config = Path('project.godot').read_text()
          assert 'textures/vram_compression/import_etc2_astc=true' in config, 'iOS export setting missing'

          print('Animation patch completed')
          PYTHON

          python3 /tmp/patch_animations.py

      - name: Install Godot 4.4.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Check Godot before saving
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --import --quit 2>&1 | tee import.log
          godot --headless --path . --quit-after 25 2>&1 | tee play.log

          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid set index' import.log play.log; then
            echo "Game script error detected"
            exit 1
          fi

      - name: Save game after successful test
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add scripts/pea_anim.gd scripts/garden.gd scripts/main.gd

          if ! git diff --cached --quiet; then
            git commit -m "Animate Peashooter in Garden v0.5"
            git push
          fi
