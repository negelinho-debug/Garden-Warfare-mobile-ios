
name: Import Garden Game

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack game
        run: |
          unzip -oq Garden_Project_v0.3_NoCubes.zip -d . -x '.github/*'
          test -f project.godot
          test -f assets/models/peashooter.glb
          rm Garden_Project_v0.3_NoCubes.zip

      - name: Save game files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Garden Game v0.3"
          git push

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Check Godot game
        run: |
          godot --headless --path . --editor --import --quit
          godot --headless --path . --quit-after 5
